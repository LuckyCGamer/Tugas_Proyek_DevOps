services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: laundry_root_123
      MYSQL_DATABASE: laundry_db
    volumes:
      - db_data:/var/lib/mysql

  app:
    image: luckycgamer/laundry-app:latest
    build: .                        
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: laundry_root_123
      DB_NAME: laundry_db
    volumes:
      - app_data:/app/data          

volumes:
  db_data:
  app_data: