services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: laundry_root_123
      MYSQL_DATABASE: laundry_db
    volumes:
      - db_data:/var/lib/mysql

  backend:
    image: luckycgamer/laundry-app:latest
    command: ["node", "server/server.js"]
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: laundry_root_123
      DB_NAME: laundry_db
    volumes:
      - app_data:/app/data

  frontend:
    image: luckycgamer/laundry-app:latest
    command: ["nginx", "-g", "daemon off;"]
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  db_data:
  app_data: