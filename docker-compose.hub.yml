services:
  db:
    image: mysql:8.0
    pull_policy: always
    container_name: laundry-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-laundry_root_123}
      MYSQL_DATABASE: ${DB_NAME:-laundry_db}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    image: luckycgamer/laundry-app:latest    # diambil dari Docker Hub, tanpa build
    pull_policy: always                  # selalu cek versi terbaru
    container_name: laundry-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-laundry_root_123}
      DB_NAME: ${DB_NAME:-laundry_db}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
    volumes:
      - app_data:/app/data

volumes:
  db_data:
  app_data: