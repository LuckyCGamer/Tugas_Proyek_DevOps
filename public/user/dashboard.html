<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard User - Laundry</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>Laundry</h1>
    <div><span id="hello"></span> <button class="small" onclick="logout()">Keluar</button></div>
  </header>

  <main class="container">
    <div id="msg" class="msg hidden"></div>

    <section class="card">
      <h2>Buat Pesanan</h2>
      <form id="orderForm">
        <div class="row">
          <div>
            <label>Jenis Layanan</label>
            <select id="serviceSelect" required></select>
          </div>
          <div>
            <label>Berat (kg)</label>
            <input id="weight" type="number" step="0.01" min="0.01" max="999.99" required>
          </div>
        </div>
        <div class="total">Perkiraan total: <span id="totalPreview">Rp 0</span></div>
        <button type="submit">Pesan Sekarang</button>
      </form>
    </section>

    <section class="card">
      <h2>Riwayat Pesanan</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>No</th><th>Layanan</th><th>Berat</th><th>Total</th><th>Status</th><th>Tanggal</th></tr>
          </thead>
          <tbody id="orderRows"></tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <h2>Profil Saya</h2>
      <form id="profileForm">
        <label>Nama</label>
        <input id="pName" required>
        <label>No. Telepon</label>
        <input id="pPhone">
        <label>Alamat</label>
        <textarea id="pAddress" rows="2"></textarea>
        <button type="submit">Simpan Profil</button>
      </form>
    </section>
  </main>

  <script src="/js/common.js"></script>
  <script src="/user/user.js"></script>
</body>
</html>
