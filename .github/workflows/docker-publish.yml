name: CI/CD Laundry App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      publish:
        description: "Push the image to Docker Hub"
        type: boolean
        default: false
      tag:
        description: "Extra image tag, e.g. v1.0 (optional)"
        type: string
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Test (syntax, lint, unit test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax of all JavaScript files
        run: find server public -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Lint (skipped if there is no lint script)
        run: npm run lint --if-present

      - name: Unit test (skipped if there is no test script)
        run: npm test --if-present

  smoke:
    name: Smoke test (app + MySQL)
    needs: [test]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laundry_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      PORT: 3000
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: laundry_db
      JWT_SECRET: ci-test-secret
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Import database schema (any .sql file in the repo)
        run: |
          for f in $(find . -name "*.sql" -not -path "./node_modules/*" | sort); do
            echo "Importing $f"
            mysql -h 127.0.0.1 -uroot -proot laundry_db < "$f" || echo "Import of $f failed, continuing"
          done

      - name: Start the app in the background
        run: npm start > app.log 2>&1 &

      - name: Wait for /api/health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then
              echo ""
              echo "App is healthy after attempt $i"
              exit 0
            fi
            echo "Not ready yet, attempt $i of 30..."
            sleep 3
          done
          echo "App is not healthy"
          exit 1

      - name: Show app log on failure
        if: failure()
        run: cat app.log

  config:
    name: Validate Docker files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config -q

      - name: Lint Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  docker:
    name: Docker (build and push to Docker Hub)
    needs: [test, config, smoke]
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
  
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
  
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
  
      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/laundry-app
          tags: |
            type=raw,value=latest
            type=sha
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
  
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max