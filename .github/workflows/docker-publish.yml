name: CI/CD Laundry App

# Kapan workflow berjalan
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:        # boleh dijalankan manual dari tab Actions

jobs:
  # ===== JOB 1: Test =====
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode dari repository
        uses: actions/checkout@v4

      - name: Pasang Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependency
        run: npm ci

      - name: Cek syntax semua file JavaScript
        run: find server public -name "*.js" -print0 | xargs -0 -n1 node --check

  # ===== JOB 2: Build dan push image =====
  docker:
    needs: test               # hanya jalan jika job test berhasil
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode dari repository
        uses: actions/checkout@v4

      - name: Login ke Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Siapkan Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Tentukan nama dan tag image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/laundry-app
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build dan push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}